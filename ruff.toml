# =============================================================
# تنظیمات Ruff برای پروژهٔ PARTO  (بازرسی نهم)
#
# چرا این فایل لازم است؟
#   بدون تنظیمات، `ruff --fix` در بازرسی هشتم بلوک «بازصدور» عمدیِ
#   config/settings.py را به‌عنوان «import بی‌استفاده» حذف کرد و سه
#   فایل را شکست. این فایل الگوهای عمدی پروژه را مستند و از lint
#   مستثنا می‌کند.
#
# قواعد انتخاب‌شده:
#   F     خطاهای واقعی پایتون (متغیر/import بی‌استفاده، نام تعریف‌نشده…)
#   E9    خطاهای نحوی
#   I     ترتیب import ها
#   UP    نحو مدرن‌تر (به‌جز موارد ناسازگار با پایتون ۳٫۹)
#   SIM   ساده‌سازی‌های منطقی
#   RUF   قواعد خودِ ruff
#   S110  try/except/pass بی‌توضیح
#   C4    درک‌ها و ساخت‌های ساده‌تر
#   PIE   موارد جزئی ولی مفید
#   BLE   استثناهای عام (except Exception / bare except)
# =============================================================

# ابزارهای راستی‌آزمایی (dev-only) از lint بیرون‌اند: خودشان عمداً
# خطاها را می‌گیرند و الگوهایشان با کد محصول یکی نیست.
extend-exclude = ["verify_fixes*.py"]

target-version = "py39"
line-length = 100

[lint]
select = [
    "F",
    "E9",
    "I",
    "UP",
    "SIM",
    "RUF",
    "S110",
    "C4",
    "PIE",
    "BLE",
]

ignore = [
    # --- ناسازگار با پایتون ۳٫۹ در زمان اجرا ---
    # (list[str] در ۳٫۹ مجاز است و UP006 فعال شده، ولی X | Y فقط از ۳٫۱۰)
    "UP007",   # X | Y به‌جای Union
    "UP045",   # X | None به‌جای Optional[X]

    # --- متن فارسی ---
    "RUF001",  # نویسه‌های شبیه‌هم‌شکل عربی/فارسی در متن
    "RUF002",
    "RUF003",

    # --- عمدی در این پروژه ---
    "UP031",   # قالب % برای پیام‌های چاپی
    "UP032",   # format() به‌جای f-string در چند جای خوانا
]

[lint.per-file-ignores]
# بازصدورهای عمدی برای مصرف‌کننده‌های بیرونی («X as X» استاندارد PEP 484 است)
"config/settings.py" = ["PLC0414"]
"models/__init__.py" = ["PLC0414"]

# ابزارهای راستی‌آزمایی خودشان سپر خطا هستند
"verify_fixes*.py" = ["BLE001", "S110", "S101", "F841"]

# تست‌ها از assert استفاده می‌کنند
"tests/*" = ["S101"]

# =============================================================
# سیاستِ «مرز خطا» (بازرسی نهم و دهم)
#
# BLE001 یعنی «except Exception / bare except». در لایه‌های زیر این
# الگو *عمدی و معماری* است، نه بدهی فنی:
#
#   • dal/**             → دور نهم باریک شد و از این استثنا بیرون است؛
#                          BLE001 برای این لایه فعال می‌ماند تا کد
#                          تازهٔ دیتا هم باریک بماند.
#   • services/**        → مرز تبدیل خطای فروشگاه به ServiceError با
#                          پیام فارسی؛ باریک‌کردنش آزمون F3 در
#                          verify_fixes6 را می‌شکند (تجربهٔ دور نهم).
#   • views/**           → مرز UI؛ یک خطای جزئی نباید پنجره را ببندد.
#   • database/**        → بالاآمدن برنامه اولویت دارد.
#   • utils/**           → عملیات «بهترین‌تلاش» (پشتیبان‌گیری، لاگ).
#   • models/**          → تفسیر دادهٔ ذخیره‌شده (json خراب، مقدار
#                          نامعتبر) باید به مقدار پیش‌فرض برگردد.
#
# نگهبانِ واقعی این سیاست: پویش AST در verify_fixes9.py بخش A که هیچ
# «except/pass» بی‌توضیحی را در کل درخت نمی‌پذیرد.
# =============================================================
"services/**" = ["BLE001"]
"views/**" = ["BLE001"]
"database/**" = ["BLE001"]
"utils/**" = ["BLE001"]
"models/**" = ["BLE001"]
"main.py" = ["BLE001"]
